<!DOCTYPE html>
<html>
<head>
    <title>Leaf Disease Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        button, input[type="submit"] {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover, input[type="submit"]:hover {
            background: #388e3c;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f8e9;
            border-radius: 10px;
            text-align: left;
        }

        .result p {
            margin: 8px 0;
            font-size: 15px;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 250px;
        }

        .confidence {
            font-weight: bold;
            color: #1565c0;
        }

        .remedy {
            color: #d84315;
        }

    </style>
</head>

<body>

<div class="container">
    <h2>🌿 Leaf Disease Detection</h2>

    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required><br><br>
        <input type="submit" value="Predict">
    </form>

   {% if prediction %}
    <div class="result">
        <p><strong>Disease:</strong> {{ prediction }}</p>
        <p><strong>Confidence:</strong> {{ confidence }}%</p>

        <p><strong>Cause:</strong> {{ cause }}</p>
        <p><strong>Treatment:</strong> {{ treatment }}</p>
        <p><strong>Prevention:</strong> {{ prevention }}</p>
    </div>

    <img src="{{ image_path }}" width="300">
{% endif %}
</div>

</body>
</html>
